! GWFLOW module configuration file
! This file contains default parameters for the GWFLOW module.
! It is read by SWAT+ when the gwflow module is activated in codes.bsn
!
! Parameters below use INI-style key = value pairs.
! Lines starting with ! are comments.

[general]
! Cell size in map units (metres)
cell_size = 250

! Boundary condition type
! 1 = constant head, 2 = no-flow
boundary_conditions = 2

! Recharge connection type
! 1 = HRU-cell, 2 = LSU-cell, 3 = both
recharge = 1

! Recharge delay (days)
recharge_delay = 0

[flags]
! Groundwater to soil transfer (0 = off, 1 = on)
soil_transfer = 0

! Saturation excess flow (0 = off, 1 = on)
saturation_excess = 0

! External groundwater pumping (0 = off, 1 = on)
external_pumping = 0

! Tile drainage (0 = off, 1 = on)
tile_drainage = 0

! Reservoir exchange (0 = off, 1 = on)
reservoir_exchange = 0

! Wetland exchange (0 = off, 1 = on)
wetland_exchange = 0

! Floodplain exchange (0 = off, 1 = on)
floodplain_exchange = 0

! Canal seepage (0 = off, 1 = on)
canal_seepage = 0

! Solute transport (0 = off, 1 = on)
solute_transport = 0

[output]
! Daily output (0 = off, 1 = on)
daily_output = 0

! Annual output (0 = off, 1 = on)
annual_output = 1

! Average annual output (0 = off, 1 = on)
aa_output = 1

[default_zone]
! Default aquifer hydraulic conductivity (m/day)
aquifer_k = 10.0

! Default specific yield (dimensionless)
specific_yield = 0.1

! Default streambed hydraulic conductivity (m/day)
streambed_k = 1.0

! Default streambed thickness (m)
streambed_thickness = 1.0
